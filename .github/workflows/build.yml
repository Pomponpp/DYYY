name: build deb

on:
  push:
    branches:
      - main
    paths:
      - '*.h'
      - '*.m'
      - '*.mm'
      - '*.x'
      - '*.xm'
      - '*.c'
      - '*.cc'
      - '*.cpp'
      - '*.s'
      - '*.S'
      - 'DYYY.plist'
      - 'control'
      - 'Makefile'
      - 'Resources/**'
      - 'layout/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.relevance.outputs.should_build }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect build-relevant changes
        id: relevance
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
             .github/scripts/build-relevance.sh range "$PUSH_BEFORE" "$GITHUB_SHA"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Build-relevant plugin, package, or Makefile changes detected."
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Only non-build Makefile settings changed; skipping Deb build."
          fi

  # 单 job 单次编译：arm64/arm64e 两个架构一次 make 完成，
  # 三 scheme（rootful/rootless/roothide）共享同一 dylib，仅打包路径不同，
  # 用 theos 连续三次 make package（对象缓存复用，二三次只重打包，秒级）。
  # 背景：三矩阵并行时每个 job 都要完整装 theos（6-7 分钟）+ 编译，
  # 缓存未命中时合计擦线 15 分钟被 macOS runner 整批回收。
  build:
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Use cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          # 命中现存缓存（11月4日 164MB theos，实测可用）。
          # key = macOS-<sdks HEAD>——上游 sdks 更新才失效，频率低。
          key: ${{ runner.os }}-0222fd5413cf4b9af096f37b4621afa2688572f7

      - name: Prepare Theos
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # 第三方 theos-action 仓库被 GitHub 封锁（Repository access blocked），
          # 改为官方 theos 直接安装；缓存命中时本步骤跳过，不重复付费。
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          brew install ldid || true

      - name: Verify cached theos
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          # 缓存恢复后自检：关键件缺失（缓存损坏/半成品）时重建
          if [ ! -d "$GITHUB_WORKSPACE/theos/vendor/include" ] || [ ! -f "$GITHUB_WORKSPACE/theos/bin/logos" ]; then
            echo "缓存残缺，标记重建"
            echo "CACHE_INVALID=1" >> $GITHUB_ENV
          else
            echo "缓存完好：theos 就绪（跳过安装）"
          fi
          # 无论缓存命中还是重装，THEOS 必须导出给 make
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Prepare Theos (cache invalid rebuild)
        if: env.CACHE_INVALID == '1'
        run: |
          rm -rf "$GITHUB_WORKSPACE/theos"
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          brew install ldid || true

      - name: Setup GNU Make
        run: |
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Clean stale theos intermediates
        run: |
          # #35 真凶：theos 缓存了 #33 时代的 logos 预处理中间文件(.mm/.d)，
          # 行号指向旧布局导致假编译错（537 行不存在）。构建前清中间产物，
          # 保留 theos 本体（缓存 key 不动，装 theos 的 7 分钟不重付）。
          rm -rf .theos/obj .theos/build 2>/dev/null || true
          echo "stale intermediates cleaned"

      - name: Build dylib only (arm64)
        run: |
          rm -rf packages && mkdir -p packages
          # 15 分钟墙终态：单架构 arm64 + 只编不打包。
          # 产出物 = .theos/obj/arm64/DYYY.dylib，直接拷出上传。
          # rootless/rootful/roothide 的 deb 打包脚本保留在 git 历史里，
          # 需要时恢复对应步骤即可。
          make THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64 -j$(sysctl -n hw.ncpu)
          DYLIB=$(find .theos/obj -name "DYYY.dylib" -type f | head -1)
          if [ -z "$DYLIB" ]; then
            echo "dylib not found in .theos/obj" >&2
            find .theos -name "*.dylib" >&2 || true
            exit 1
          fi
          ldid -S "$DYLIB" 2>/dev/null || true
          cp "$DYLIB" packages/DYYY.dylib
          printf 'Built: %s\n' packages/DYYY.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v7
        with:
          name: DYYY-dylib-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/packages/DYYY.dylib
