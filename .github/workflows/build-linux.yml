name: build deb linux

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Cache theos
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: linux-theos-v5-fullsubmodules

      - name: Install theos on Linux
        run: |
          set -e
          # 关键：vendor/include 与 vendor/lib 是 theos 的 git submodule，
          # 必须带 --recursive 拉全，否则 vendor 永远残缺（此前 8 轮失败的根因）
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Install SDK
        run: |
          set -e
          SDK_DIR="$GITHUB_WORKSPACE/theos/sdks"
          mkdir -p "$SDK_DIR"
          # 缓存里可能只有残缺目录（无 SDK），必须按"有没有 .sdk"判断而非目录非空
          if [ -z "$(find "$SDK_DIR" -maxdepth 1 -type d -name "*.sdk" 2>/dev/null)" ]; then
            rm -rf "$SDK_DIR" && mkdir -p "$SDK_DIR"
            curl -fsSL -o /tmp/sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
            rm -rf /tmp/sdks && mkdir -p /tmp/sdks
            unzip -q /tmp/sdks.zip -d /tmp/sdks
            FOUND=$(find /tmp/sdks -maxdepth 3 -type d -name "iPhoneOS*.sdk" | head -1)
            if [ -n "$FOUND" ]; then
              mv "$FOUND" "$SDK_DIR/"
            else
              echo "目录结构异常，列出内容："
              find /tmp/sdks -maxdepth 3 | head -15
              exit 1
            fi
          fi
          ls "$SDK_DIR"

      - name: Install toolchain
        run: |
          set -e
          TC="$GITHUB_WORKSPACE/theos/toolchain"
          # theos 期望 toolchain/linux/iphone/bin/clang
          if [ ! -f "$TC/linux/iphone/bin/clang" ]; then
            rm -rf "$TC" && mkdir -p "$TC" /tmp/tc
            curl -fsSL -o /tmp/tc.tar.xz https://github.com/theos/toolchain/releases/download/2024.05.24/toolchain_linux_x86_64.tar.xz
            tar -xf /tmp/tc.tar.xz -C /tmp/tc
            # tar 解包结构可能是 toolchain/linux/iphone 或直接 linux/iphone
            if [ -d "/tmp/tc/toolchain/linux/iphone" ]; then
              mkdir -p "$TC"
              cp -a /tmp/tc/toolchain/* "$TC/"
            elif [ -d "/tmp/tc/linux/iphone" ]; then
              mkdir -p "$TC"
              cp -a /tmp/tc/linux "$TC/"
            else
              mkdir -p "$TC/linux/iphone"
              cp -a /tmp/tc/* "$TC/linux/iphone/"
            fi
          fi
          echo "=== clang 确认 ==="; ls "$TC/linux/iphone/bin/" | head -6
          test -f "$TC/linux/iphone/bin/clang" && echo "TOOLCHAIN OK"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils make perl
          # ldid 不在 ubuntu 源里，从官方 release 安装
          sudo curl -fsSL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid
          # theos 打包 deb 需要 dm.pl（装到 theos/bin）
          sudo curl -fsSL -o "$GITHUB_WORKSPACE/theos/bin/dm.pl" https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl
          sudo chmod +x "$GITHUB_WORKSPACE/theos/bin/dm.pl"
          ldid -V 2>/dev/null || echo "ldid installed"
          ls "$GITHUB_WORKSPACE/theos/bin/dm.pl"

      - name: Build package
        env:
          MATRIX_SCHEME: ${{ matrix.scheme }}
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          export PATH="$THEOS/bin:$PATH"
          rm -rf packages && mkdir -p packages
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j$(nproc)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-rootless.deb"
          done
          printf 'Built: %s\n' packages/*.deb

      - name: Extract dylib from deb
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -1)
          WORK=$(mktemp -d)
          ar -x "$DEB" --output="$WORK" || (mkdir -p "$WORK" && cd "$WORK" && ar -x "$OLDPWD/$DEB")
          cd "$WORK"
          if [ -f data.tar.zst ]; then
            zstd -d data.tar.zst -o data.tar
          elif [ -f data.tar.xz ]; then
            xz -d data.tar.xz
          elif [ -f data.tar.gz ]; then
            gunzip data.tar.gz
          fi
          tar -xf data.tar -C .
          DYLIB=$(find . -name "DYYY.dylib" -type f | head -1)
          if [ -z "$DYLIB" ]; then DYLIB=$(find . -name "*.dylib" -type f | head -1); fi
          echo "found dylib: $DYLIB"
          ldid -S "$DYLIB" || true
          cp "$DYLIB" "$OLDPWD/packages/DYYY_2.2-9-rootless.dylib"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DYYY-linux-rootless-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/packages/*.deb
            ${{ github.workspace }}/packages/*.dylib
          retention-days: 5
