name: build deb linux

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Cache theos
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: linux-theos-v5-fullsubmodules

      - name: Install theos on Linux
        run: |
          set -e
          # 关键：vendor/include 与 vendor/lib 是 theos 的 git submodule，
          # 必须带 --recursive 拉全，否则 vendor 永远残缺（此前 8 轮失败的根因）
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Install SDK
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/theos"
          export PATH="$THEOS/bin:$PATH"
          chmod +x "$THEOS/bin/install-sdk"
          # 官方脚本安装（latest = iPhoneOS 最新 + tvOS）
          "$THEOS/bin/install-sdk" latest
          ls "$THEOS/sdks" | head -6

      - name: Install toolchain
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/theos"
          # 官方安装脚本指定的 Linux toolchain 源（L1ghtmann/llvm-project）
          if [ ! -f "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            rm -rf "$THEOS/toolchain" && mkdir -p "$THEOS/toolchain"
            curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C "$THEOS/toolchain/"
          fi
          echo "=== clang 确认 ==="; ls "$THEOS/toolchain/linux/iphone/bin/" | head -6
          test -f "$THEOS/toolchain/linux/iphone/bin/clang" && echo "TOOLCHAIN OK"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils make perl
          # ldid 不在 ubuntu 源里，从官方 release 安装
          sudo curl -fsSL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid
          # theos 打包 deb 需要 dm.pl（装到 theos/bin）
          sudo curl -fsSL -o "$GITHUB_WORKSPACE/theos/bin/dm.pl" https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl
          sudo chmod +x "$GITHUB_WORKSPACE/theos/bin/dm.pl"
          ldid -V 2>/dev/null || echo "ldid installed"
          ls "$GITHUB_WORKSPACE/theos/bin/dm.pl"

      - name: Build package
        env:
          MATRIX_SCHEME: ${{ matrix.scheme }}
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          export PATH="$THEOS/bin:$PATH"
          rm -rf packages && mkdir -p packages
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j$(nproc)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-rootless.deb"
          done
          printf 'Built: %s\n' packages/*.deb

      - name: Extract dylib from deb
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -1)
          WORK=$(mktemp -d)
          ar -x "$DEB" --output="$WORK" || (mkdir -p "$WORK" && cd "$WORK" && ar -x "$OLDPWD/$DEB")
          cd "$WORK"
          if [ -f data.tar.zst ]; then
            zstd -d data.tar.zst -o data.tar
          elif [ -f data.tar.xz ]; then
            xz -d data.tar.xz
          elif [ -f data.tar.gz ]; then
            gunzip data.tar.gz
          fi
          tar -xf data.tar -C .
          DYLIB=$(find . -name "DYYY.dylib" -type f | head -1)
          if [ -z "$DYLIB" ]; then DYLIB=$(find . -name "*.dylib" -type f | head -1); fi
          echo "found dylib: $DYLIB"
          ldid -S "$DYLIB" || true
          cp "$DYLIB" "$OLDPWD/packages/DYYY_2.2-9-rootless.dylib"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DYYY-linux-rootless-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/packages/*.deb
            ${{ github.workspace }}/packages/*.dylib
          retention-days: 5
